# PR과 main push마다 린트·빌드를 확인한다.
# main 브랜치 보호에서 이 job(`build`) 통과를 병합 조건으로 건다. job 이름을 바꾸면 보호 설정도 함께 바꿀 것.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
